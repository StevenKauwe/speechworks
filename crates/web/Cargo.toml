[package]
name = "speechworks-web"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly bindings for Speechworks dictation and inference"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
wasm-threads = ["speechworks-inference/wasm-threads", "dep:wasm-bindgen-rayon"]

[dependencies]
speechworks = { path = "../speechworks" }
speechworks-inference = { path = "../inference" }
speechworks-vad = { path = "../vad" }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
serde-wasm-bindgen = "0.6"
js-sys = "=0.3.106"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-rayon = { version = "=1.3.0", optional = true, features = ["no-bundler"] }
