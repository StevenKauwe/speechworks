[workspace]
resolver = "3"
members = ["crates/speechworks", "crates/inference", "crates/vad", "crates/web", "tools/assets"]
default-members = ["crates/speechworks"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/StevenKauwe/speechworks"
authors = ["Steven Kaai Kauwe"]

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev.package."*"]
opt-level = 2
